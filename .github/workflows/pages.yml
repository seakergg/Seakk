name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'sw.js', 'icon-*.png', '404.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Oldal összeállítása
        run: |
          mkdir site
          cp index.html manifest.json sw.js 404.html icon-192.png icon-512.png site/
          touch site/.nojekyll
          sed -i "s/seakk-dev/seakk-${GITHUB_SHA::7}/" site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
